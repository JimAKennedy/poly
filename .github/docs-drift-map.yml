  # --- Archived docs — remove these entries when jk-standards#48 lands ------
  #
  # These carry `class: archived` and are frozen by definition; jk-standards'
  # own docs state the class contract as "archived docs are exempt", and
  # status-prose, file-line-refs, and research-provenance all honour it.
  # doc-completeness does not, so each archived page needs an entry here to
  # satisfy a check the surrounding taxonomy says should not apply to it.
  # Tracked upstream as JimAKennedy/jk-standards#48 — when a class-aware skip
  # ships, delete this whole block rather than maintaining it.

  - doc: "docs/webui-migration.md"
    reason: >-
      Archived (2026-07-22): frozen snapshot from the mid-migration
