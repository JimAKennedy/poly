# Docs drift map (M048 S02).
#
# When a PR touches any file matching a mapping's `sources` glob, the PR MUST
# ALSO touch the mapped `doc` — OR any commit in the PR range must carry a
# `Docs-Not-Affected: <reason>` trailer. Enforced by the jk-standards
# doc-drift check (configured in jk-standards.yaml) in the site-lint CI job.
#
# Purpose: prevent the "code drift, docs frozen" failure mode that motivated
# M048. If you rename a symbol, extend an enum, or change a range, the gated
# doc that describes that surface has to move in the same PR (or you have to
# explain why not, in the commit trailer, right next to the change).
#
# Add a mapping when:
#   - A new gated doc lands and it describes a specific source surface
#   - A source area gains a documented invariant not yet in the map
#
# Do NOT map:
#   - Archived docs (they are frozen by definition — the taxonomy check gates them)
#   - Docs whose content is auto-generated (they carry `class: generated` and are
#     regenerated at build time — S05/S07 introduce these)
#   - Speculative "someday this doc will describe X" pairs — only real,
#     current, checkable claims
#
# "Do NOT map" is not the same as "leave out of this file". Since jk-standards
# v0.6.0 the doc-completeness check requires EVERY doc under a doc_root to be
# accounted for here — as a `mappings` entry or as a `cannot_drift` entry with a
# written reason. A doc in the list above therefore belongs in `cannot_drift`
# below, which records why touch-correlation would be the wrong tool for it,
# rather than being omitted and silently forgotten.

version: 1

mappings:
  # Engine public API and type definitions
  - sources:
      - "engine/include/poly/types.h"
      - "engine/include/poly/engine.h"
      - "engine/include/poly/scene.h"
      - "engine/include/poly/envelope.h"
      - "engine/include/poly/macro.h"
      - "engine/include/poly/constraint.h"
      - "engine/include/poly/bridge.h"
      - "engine/include/poly/state_io.h"
      - "engine/include/poly/state_io_read_lane.h"
      - "engine/include/poly/state_io_write_lane.h"
      - "engine/include/poly/sanitize.h"
      - "engine/include/poly/rng.h"
      - "engine/src/engine.cpp"
      - "engine/src/scene.cpp"
      - "engine/src/envelope.cpp"
      - "engine/src/macro.cpp"
      - "engine/src/constraint.cpp"
      - "engine/src/bridge.cpp"
      - "engine/src/sanitize.cpp"
    doc: "docs/engine-spec.md"
    reason: "engine-spec.md documents the LaneConfig struct, macro system, envelope model, and public engine API. A change to any of these headers or their impls without a doc update creates D1-D3-style drift."

  # Euclidean rhythm implementation
  - sources:
      - "engine/include/poly/euclidean.h"
      - "engine/src/euclidean.cpp"
    doc: "docs/euclidean-rhythm-guide.md"
    reason: "euclidean-rhythm-guide.md walks through Bjorklund's algorithm and its Poly implementation. Any change to euclidean.{h,cpp} risks the guide's worked examples becoming false."

  # Factory presets and category taxonomy
  - sources:
      - "engine/include/poly/presets.h"
      - "engine/src/presets.cpp"
      - "engine/tools/emit_presets.cpp"
    doc: "docs/preset-taxonomy.md"
    reason: "preset-taxonomy.md documents the 10-category taxonomy and every preset's category assignment. Adding, removing, or recategorizing a preset without updating the taxonomy is the exact drift that triggered M047."

  # MIDI note capture and mapping
  - sources:
      - "engine/include/poly/midi_capture.h"
      - "engine/src/midi_capture.cpp"
      - "engine/include/poly/smf_writer.h"
      - "engine/src/smf_writer.cpp"
    doc: "docs/midi-note-mapping.md"
    reason: "midi-note-mapping.md documents the note inventory Poly emits (GM-adjacent). Capture and SMF-writer changes are exactly where note-number contracts can drift."

  # Sample library and its manifest
  - sources:
      - "site/public/samples/manifest.json"
      - "scripts/fetch-samples.sh"
      - "scripts/check-sample-manifest.sh"
    doc: "docs/sample-sourcing.md"
    reason: "sample-sourcing.md is the licensing/attribution ledger for every CC sample shipped. Any manifest change (new sample, renamed folder, license swap) must land with a docs update, or the credits are wrong."

  # Test strategy
  #
  # M049 S10 tightening: only shape-changing files trigger this mapping. Adding
  # one more .cpp / .spec.ts / .test.mjs inside an existing binary or suite is
  # NOT a taxonomy change — testing-strategy.md classifies levels (L1 engine,
  # L2 bridge, L3 host, L4 Cubase) and the surface that houses each level, not
  # the individual regression tests. Broadening the glob to tests/** caused a
  # false positive on every M049 engine PR (S01/S02/S03/S04/S05/S08/S09) that
  # added a single regression test file, requiring a Docs-Not-Affected trailer
  # each time. The narrow set below matches the actual reshape signal:
  #   * tests/CMakeLists.txt      — new C++ test binary (add_executable) or
  #                                  new subdir wiring reshapes taxonomy
  #   * site/playwright.config.ts — Playwright project/reporter/dir changes
  #                                  reshape the L2/L4-web surface definition
  #   * site/package.json         — new npm test script or test-framework dep
  #                                  is where a whole new JS test category
  #                                  gets its entry point
  - sources:
      - "tests/CMakeLists.txt"
      - "site/playwright.config.ts"
      - "site/package.json"
    doc: "docs/testing-strategy.md"
    reason: "testing-strategy.md classifies test categories (L1 engine, L2 bridge, L3 host, L4 Cubase) and the surfaces that house them. Adding a new test binary (CMakeLists), reshaping the Playwright surface (config), or introducing a new JS test entry-point (package.json) is a taxonomy change that must land with a doc update. Per-file additions to existing binaries or suites do not — they exercise the taxonomy, they don't change it."

  # Plugin UI (native VSTGUI header)
  - sources:
      - "plugin/source/ui/**"
      - "plugin/source/controller.cpp"
      - "plugin/source/controller.h"
      - "plugin/source/controller_base.cpp"
      - "plugin/source/controller_base.h"
    doc: "docs/ui-guide.md"
    reason: "ui-guide.md describes the plugin header UI (preset selector, lanes area, macros). Changes to header/lanes/macros widgets or controller wiring should update the UI walkthrough."

  # Cubase-specific workflow
  - sources:
      - "plugin/source/processor.cpp"
      - "plugin/source/processor.h"
      - "plugin/source/factory.cpp"
      - "plugin/source/plugids.h"
    doc: "docs/cubase-workflow.md"
    reason: "cubase-workflow.md documents transport/MIDI-routing behavior a Cubase user sees. Processor and factory changes are the most likely to affect that surface."

  # PR-AF review workflow itself
  - sources:
      - ".github/workflows/pr-af-review.yml"
    doc: "docs/pr-af-review.md"
    reason: "pr-af-review.md is the user-facing description of the opt-in AI review. The workflow file and the doc must agree on trigger label, model, cost, and cadence."

# ---------------------------------------------------------------------------
# cannot_drift — docs deliberately NOT touch-correlated, each with its reason.
#
# Required by the jk-standards doc-completeness check (v0.6.0+): every doc under
# a doc_root must be either mapped above or declared here. A `cannot_drift`
# entry is a claim, not a waiver — it asserts that a source change cannot make
# this page false, and it should be deleted the moment that stops being true.
#
# The recurring rationales below are:
#   (a) the page is emitted or data-driven at build time, so it follows the
#       engine automatically and a mapping would only manufacture false
#       positives on every change;
#   (b) the page narrates a surface whose touch-correlation is already carried
#       by a mapped docs/ counterpart, and duplicating it would double every
#       obligation without adding a signal;
#   (c) the page is musical scholarship or narrative, with no repo source
#       surface to drift against;
#   (d) the page is an operator runbook for infrastructure that lives outside
#       this tree (a physical runner, a Cubase install, a disk image).
# ---------------------------------------------------------------------------

cannot_drift:
  # --- (a) Emitted or data-driven at build time -----------------------------

  - doc: "site/src/content/docs/appendix-parameters.mdx"
    reason: >-
      Generated by scripts/generate-param-docs.mjs from the engine headers and
      declared under `generated:` in jk-standards.yaml, so it is freshness-gated
      by generated-freshness. A parameter add or range change regenerates the
      page; there is no hand-maintained prose for a source edit to be mirrored
      into, and a mapping would fire on every regeneration.

  - doc: "site/src/content/docs/appendix-euclidean-reference.mdx"
    reason: >-
      Generated by scripts/generate-euclidean-appendix.mjs and declared under
      `generated:` in jk-standards.yaml. Same contract as appendix-parameters:
      the emitter is the single source, freshness is gated by
      generated-freshness, and touch-correlation has nothing to enforce.

  - doc: "site/src/content/docs/appendix-presets.mdx"
    reason: >-
      The parameter tables render from site/src/generated/presets.json via
      PresetTable.astro, and presets.json is produced by running the C++
      poly_presets_emit binary against the real engine as the site prebuild
      step; the headline counts come from generated counts.json. Adding or
      recategorising a preset updates the emitted JSON and the page follows
      with no source edit to mirror, so mapping presets.cpp here would
      manufacture a false positive on every preset change. Full-catalogue
      taxonomy claims remain enforced through docs/preset-taxonomy.md above.

  - doc: "site/src/content/docs/credits.mdx"
    reason: >-
      Renders <CreditsList />, which imports site/public/samples/manifest.json
      directly — every attribution row is manifest-derived, which is why the
      page's own prose states it "cannot drift out of sync with what actually
      plays". The licensing obligation that CAN drift (a new sample landing
      without attribution) is touch-correlated through docs/sample-sourcing.md
      above, which is mapped to the manifest.

  - doc: "site/src/content/docs/index.mdx"
    reason: >-
      Site landing page. Catalogue counts are imported from generated
      counts.json and update at build time; the surrounding prose describes the
      guide's shape and reading order, not any code surface.

  # --- (b) Surface already touch-correlated by a mapped docs/ counterpart ---

  - doc: "site/src/content/docs/appendix-midi-mapping.mdx"
    reason: >-
      Documents the GM-adjacent note inventory, the same surface as
      docs/midi-note-mapping.md, which is mapped above to midi_capture.{h,cpp}
      and smf_writer.{h,cpp}. The note-number contract is genuinely driftable,
      but enforcing it at two docs doubles every obligation without adding a
      signal; docs/midi-note-mapping.md is the enforcement point and this
      appendix is its site-side presentation.

  - doc: "site/src/content/docs/appendix-timing-model.mdx"
    reason: >-
      Explains cyclePpq, Tempo Mult, and additive (aksak) cell mode — contracts
      owned by docs/engine-spec.md, which is mapped above to engine.{h,cpp} and
      types.h. The spec is the enforcement point; this appendix is the worked-
      example narration of it.

  - doc: "site/src/content/docs/appendix-plugin-architecture.mdx"
    reason: >-
      Narrates the poly_engine / poly_plugin split, threading model, RT-safety
      discipline, and state serialization across many files at once. Its
      constituent surfaces are already mapped above to docs/engine-spec.md,
      docs/ui-guide.md, and docs/cubase-workflow.md. A plugin/source/** glob
      here would fire on every plugin change while the structural claims it
      makes — which layer may allocate, which thread owns what — change only on
      a deliberate architecture change that ARCHITECTURE.md governs.

  - doc: "site/src/content/docs/appendix-testing-architecture.mdx"
    reason: >-
      Describes the L0-L4 test layering, whose taxonomy is owned by
      docs/testing-strategy.md above. That mapping's trigger set was
      deliberately narrowed in M049 S10 to shape-changing files only, after a
      tests/** glob produced a false positive on every engine PR that added one
      regression test. Duplicating it here would reintroduce exactly that cost.

  - doc: "site/src/content/docs/appendix-website-architecture.mdx"
    reason: >-
      Covers the Astro + Starlight foundation, the generated-JSON pipeline, the
      sample loader, and the WebAudio playback stack. This is site
      infrastructure with no engine-side contract, and the generation pipeline
      it documents is itself freshness-gated by generated-freshness, so the
      claims most likely to rot are already covered by a stronger check.

  - doc: "site/src/content/docs/appendix-design-decisions.mdx"
    reason: >-
      A dated record of why choices were made. Rationale does not become false
      when the code it justified changes — superseding a decision adds a new
      entry rather than editing an old one — so touch-correlation would flag
      edits that are correct by construction.

  - doc: "site/src/content/docs/appendix-references.mdx"
    reason: >-
      Bibliography of external musical and technical sources (books, papers,
      recordings). Cites work outside this repository entirely; no source file
      can make it false.

  # --- (c) Musical scholarship and narrative walkthrough --------------------
  #
  # The numbered chapters teach rhythmic tradition and technique. Their claims
  # are musicological — what a clave is, how a tala cycles — and are falsified
  # by ethnomusicology, not by a commit. Where a chapter demonstrates a Poly
  # feature it does so through <PolyPatch> blocks driven by generated preset
  # JSON, so the audible examples follow the engine automatically.

  - doc: "site/src/content/docs/introduction.mdx"
    reason: >-
      Narrative framing of what Poly is and who the guide is for. Describes
      intent and reading order rather than any code surface.

  - doc: "site/src/content/docs/01-foundations.mdx"
    reason: >-
      Teaches Euclidean rhythm and cycle independence as musical concepts.
      Bjorklund's algorithm as implemented is documented by
      docs/euclidean-rhythm-guide.md, which is mapped above.

  - doc: "site/src/content/docs/02-sub-saharan-africa.mdx"
    reason: >-
      Musicology of West and Central African bell patterns and polymetric
      layering. No repo source surface.

  - doc: "site/src/content/docs/03-afro-cuban.mdx"
    reason: >-
      Musicology of clave and the Afro-Cuban rhythmic matrix. No repo source
      surface.

  - doc: "site/src/content/docs/04-afrobeat.mdx"
    reason: >-
      Musicology of Afrobeat phrase architecture and extended grooves. No repo
      source surface.

  - doc: "site/src/content/docs/05-gamelan.mdx"
    reason: >-
      Musicology of gamelan interlocking (kotekan) and cyclic time. No repo
      source surface.

  - doc: "site/src/content/docs/06-indian-classical.mdx"
    reason: >-
      Musicology of tala cycles and rhythmic arithmetic. No repo source
      surface.

  - doc: "site/src/content/docs/07-balkan.mdx"
    reason: >-
      Musicology of aksak and asymmetric groove. The additive-cell feature that
      realises it is contracted in docs/engine-spec.md, mapped above.

  - doc: "site/src/content/docs/08-minimalism.mdx"
    reason: >-
      Musicology of phase, drift, and gradual process. No repo source surface.

  - doc: "site/src/content/docs/09-electronic.mdx"
    reason: >-
      Musicology of grid, probability, and machine rhythm. No repo source
      surface.

  - doc: "site/src/content/docs/10-brazilian.mdx"
    reason: >-
      Musicology of samba, bossa nova, and syncopated flow. No repo source
      surface.

  - doc: "site/src/content/docs/11-funk-soul.mdx"
    reason: >-
      Musicology of ghost notes, pocket, and push-pull feel. No repo source
      surface.

  - doc: "site/src/content/docs/12-jazz.mdx"
    reason: >-
      Musicology of swing, limb independence, and conversational drumming. No
      repo source surface.

  - doc: "site/src/content/docs/13-drum-and-bass.mdx"
    reason: >-
      Musicology of breakbeat construction at high tempo. No repo source
      surface.

  - doc: "site/src/content/docs/14-synthesis.mdx"
    reason: >-
      Combines the preceding traditions into cross-cultural technique. Spans
      every chapter rather than tracking one surface.

  - doc: "site/src/content/docs/15-compositional-grammar.mdx"
    reason: >-
      Compositional guidance on structure, density, and arc. Aesthetic
      technique, not a code contract.

  - doc: "site/src/content/docs/16-midi-capture-export.mdx"
    reason: >-
      User-facing walkthrough of capturing and exporting MIDI. The contracts it
      depends on — note inventory and SMF format — are touch-correlated through
      docs/midi-note-mapping.md above, which is mapped to midi_capture.{h,cpp}
      and smf_writer.{h,cpp}.

  - doc: "site/src/content/docs/17-midi-routing-note-map.mdx"
    reason: >-
      User-facing routing walkthrough over the same note-map surface as
      docs/midi-note-mapping.md, which is mapped above and is the enforcement
      point for note-number claims.

  - doc: "site/src/content/docs/18-editors-and-views.mdx"
    reason: >-
      Walkthrough of the editors and advanced views. The widget and controller
      surface is mapped above to docs/ui-guide.md, which is the enforcement
      point for UI-shape claims.

  - doc: "site/src/content/docs/guide-using-poly.mdx"
    reason: >-
      Task-oriented "how do I" guide spanning transport, lanes, macros, and
      export. It crosses every surface rather than mirroring one, and the
      per-surface contracts are mapped above.

  - doc: "site/src/content/docs/component-demo.mdx"
    reason: >-
      Hidden test page (sidebar.hidden) exercising every custom MDX component
      so rendering regressions are visible in one place. It documents nothing;
      it is a fixture, and it changes when a component changes, not when the
      engine does.

  # --- (c) Counterpoint theory pages ---------------------------------------
  #
  # The theory-* family analyses how independent rhythmic lines interact within
  # each tradition. Same contract as the numbered chapters: musicological
  # claims, audible examples driven by generated preset JSON.

  - doc: "site/src/content/docs/theory-counterpoint-overview.mdx"
    reason: >-
      Frames rhythmic counterpoint as an analytic method across the family. No
      repo source surface.

  - doc: "site/src/content/docs/theory-sub-saharan-africa.mdx"
    reason: >-
      Timeline-counterpoint analysis of Sub-Saharan traditions. No repo source
