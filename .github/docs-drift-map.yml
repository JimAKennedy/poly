  # --- (d) Operator runbooks and milestone UAT artifacts --------------------

  - doc: "docs/windows-test-runner-setup.md"
    reason: >-
      Operator runbook for provisioning the self-hosted Windows test runner.
      Its steps target machine state that lives outside this repository — OS
      configuration, service accounts, installed toolchains — so no source file
      can make it false. It is verified by re-running it on a rebuild, not by
      touch-correlation.

  - doc: "docs/windows-test-runner-setup-issues.md"
    reason: >-
      Troubleshooting log of failures hit while provisioning that runner, with
      the resolution for each. A dated record of what went wrong on a specific
      machine; superseding it means adding an entry, not editing history.

  - doc: "docs/windows-runner-rehome-and-deelevate.md"
    reason: >-
      Runbook for relocating the Windows runner and dropping it from elevated
