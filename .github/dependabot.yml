# M050 S05 (G6): Dependabot configuration.
#
# Watches the three ecosystems Poly actually ships with:
#   1. github-actions   -- all pinned action SHAs/tags in .github/workflows/
#   2. npm (/site)      -- Astro/Starlight guide site + Playwright e2e + sharp
#   3. npm (/webui)     -- Playwright host tests + ajv (bundle has no runtime deps)
#
# No submodules and no other tracked manifests. The emsdk package.json under
# .gsd/tools/ is gitignored and out of scope. VST3 SDK is FetchContent-vendored
# from CMakeLists.txt, not a package manifest -- upstream tag bumps live in the
# CMake file and are reviewed manually.
#
# Grouping policy: minor + patch bumps land in one grouped PR per ecosystem
# per week so routine work reads as a single review. Majors open individual
# PRs because they carry breaking-change risk (esp. Astro / Starlight / sharp).
#
# open-pull-requests-limit caps ecosystem inbox flood at 5 concurrent PRs.
#
# /site declares both `playwright` and `@playwright/test`, and
# site/tests/mermaid-build-deps.test.mjs requires their ranges to match. Two
# settings keep them in step: the `playwright` group moves both packages in
# one PR for every update type, majors included, and `versioning-strategy:
# increase` rewrites each range to the new version. Without the strategy,
# #370 bumped both in the lockfile but left `playwright` at `^1.63.0`,
# because that range already admitted 1.64.0.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - JimAKennedy
    assignees:
      - JimAKennedy
    labels:
      - dependencies
      - dependabot
      - github-actions
    commit-message:
      prefix: chore(actions)
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - JimAKennedy
    assignees:
      - JimAKennedy
    labels:
      - dependencies
      - dependabot
      - npm
      - site
    versioning-strategy: increase
    commit-message:
      prefix: chore(site-deps)
    groups:
      # Declared first: a dependency joins the first group it matches.
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
      site-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - JimAKennedy
    assignees:
      - JimAKennedy
    labels:
      - dependencies
      - dependabot
      - npm
      - webui
    commit-message:
      prefix: chore(webui-deps)
    groups:
      webui-minor-patch:
        update-types:
          - minor
          - patch
