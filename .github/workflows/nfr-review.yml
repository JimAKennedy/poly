name: NFR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  nfr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download nightly baseline
        id: baseline
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          name: nfr-review-baseline
          workflow: nfr-review-nightly.yml
          branch: main
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run NFR Review
        uses: JimAKennedy/nfr-review@f1b1fedc96c944547abe6dda995c1883a4e60707 # v1
        with:
          baseline: ${{ steps.baseline.outcome == 'success' && 'nfr-review-output.jsonl' || '' }}
          fail-on: "red"
