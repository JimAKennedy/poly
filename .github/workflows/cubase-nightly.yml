name: Cubase Nightly (L4)

# M042 S07: Cubase-in-the-loop nightly. Runs on the self-hosted Windows runner
# (label `cubase`) — the only machine with Cubase activated and an interactive
# desktop. It builds Poly with MSVC (CI parity), runs the below-Cubase pyramid
# (ctest), installs the .vst3, then drives the launch -> wait-ready -> quit
# cycle via the scripts/cubase/ PowerShell machinery and archives artifacts.
#
# SECURITY (testing-strategy.md §3.2, non-negotiable): the self-hosted runner
# executes repository code. This workflow triggers ONLY on `schedule` and
# manual `workflow_dispatch` — NEVER `pull_request`. A pull_request trigger
# would let any fork's PR run arbitrary code on the licensed box. Do not add
# one.
#
# Scope: with no fixture set (POLY_FIXTURE_CPR empty) this is the S07 launch/quit
# smoke — trigger -> build -> launch Cubase -> quit cleanly -> upload artifacts.
# S08 adds the transport+probe machinery (mido driver, MIDI Remote script,
# fixture .cpr, probe-vs-golden compare): setting POLY_FIXTURE_CPR to the
# committed fixture turns on the "Play scenario" and "Compare probe output to
# golden" steps below. That fixture + the loopMIDI 'poly-test' port are authored
# on the runner by the owner (R10), so those steps stay dormant until then.

on:
  schedule:
    # 02:00 UTC nightly — offset from the 03:00 sanitizer/NFR nightlies so the
    # single self-hosted runner isn't contended.
    - cron: "0 2 * * *"
  workflow_dispatch:

# Only one Cubase run at a time — there is a single self-hosted runner and
# Cubase/loopMIDI/interactive-desktop state is machine-global. Newer runs wait
# for the in-flight one rather than colliding on it.
concurrency:
  group: cubase-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  cubase-nightly:
    name: Cubase launch/quit smoke
    runs-on: [self-hosted, cubase]
    # The launch/quit cycle has a hard ceiling; if Cubase hangs, fail the job
    # rather than pinning the single runner indefinitely.
    timeout-minutes: 30
    env:
      # Where the built plugin is installed for Cubase to load.
      POLY_VST3_INSTALL_DIR: "C:\\Program Files\\Common Files\\VST3"
      # Probe output path — the launch script exports this so poly_midi_probe
      # (S06) flushes JSONL here on Cubase deactivate.
      POLY_PROBE_OUTPUT: "${{ github.workspace }}\\_artifacts\\probe.jsonl"
      # Staging dir the scripts archive logs/recordings/probe output into.
      POLY_ARTIFACT_DIR: "${{ github.workspace }}\\_artifacts"
      # Fixture project. Empty => S07 launch/quit smoke (no project, no
      # transport). Non-empty => S08 transport+probe run: the driver plays the
      # fixture and the probe JSONL is compared against the golden below. The
      # committed fixture is tests/cubase/fixtures/poly-4bar.cpr (authored on the
      # runner in Cubase, PR #186 — a .cpr is Cubase-version-specific, only
      # Cubase can write one). Now set, so the "Play scenario" + "Compare probe
      # output to golden" steps below are live. The loopMIDI 'poly-test' port +
      # MIDI Remote script must be provisioned on the runner (R10) for the driver
      # to reach the ready ping; the wait-for-ready timeout fails loud otherwise.
      POLY_FIXTURE_CPR: "${{ github.workspace }}\\tests\\cubase\\fixtures\\poly-4bar.cpr"
      # Golden the probe JSONL is compared against when a fixture is set. The
      # fixture uses Poly's default patch, so this is the default-patch
      # processor-level golden (note-ons: ppq/pitch/velocity/channel).
      POLY_GOLDEN: "${{ github.workspace }}\\tests\\golden\\processor_default_4bars.txt"
      # Cubase major version the runner has installed and activated (M042 S07
      # decision: Cubase 14). Scripts use this to resolve the Cubase.exe path
      # and prefs/log directories.
      POLY_CUBASE_VERSION: "14"
      # S09 (L4-web): CDP remote-debugging port for Cubase's embedded WebView2.
      # Empty => the e2e flow is off (the launch step does not pass -EnableCdp,
      # so S07/S08 launches are unaffected). Non-empty => the launch step opens
      # WebView2's CDP on this port and the Playwright-over-CDP e2e attaches.
      # Localhost-only; gated by the box's LAN posture (Part 10). Windows-only
      # (WKWebView exposes no CDP). See docs/windows-test-runner-setup.md Part 12.
      POLY_CDP_PORT: ""
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Preflight: every step below runs `shell: pwsh` (PowerShell 7+). A fresh
      # self-hosted Windows box ships only Windows PowerShell 5.1 (powershell.exe),
      # NOT pwsh — GitHub-hosted images pre-install it, self-hosted ones do not.
      # Without this guard a missing pwsh surfaces as a cryptic
      # "pwsh: command not found" cascade on the first real step. This runs in
      # the runner's default shell (cmd) so it works even when pwsh is absent,
      # and fails loud with the exact remediation.
      # Runs in cmd (available even when pwsh is absent). Uses `||` short-circuit
      # rather than a parenthesized multi-line `if ( )` block: cmd's parser treats
      # a literal `(` inside the echo'd message as closing the block, which
      # produced a "not was unexpected at this time" syntax error. The message
      # below therefore contains no parentheses, and the whole guard is one line.
      - name: Preflight — PowerShell 7 (pwsh) present
        shell: cmd
        run: |
          where pwsh || (echo ::error::PowerShell 7 pwsh not found on this runner. Every step uses shell pwsh. Install via winget install --id Microsoft.PowerShell then RESTART the runner logon task and re-dispatch. See docs/windows-test-runner-setup.md Part 2.& exit /b 1)
          pwsh --version

      - name: Prepare artifact staging dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.POLY_ARTIFACT_DIR }}" | Out-Null

      # --- Below-Cubase pyramid on the runner (CI parity with ci.yml build leg) ---
      - name: Configure (MSVC, validator ON)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DSMTG_RUN_VST_VALIDATOR=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (ctest)
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install plugin for Cubase
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path build -Recurse -Filter poly_plugin.vst3 -Directory |
            Select-Object -First 1
          if (-not $src) {
            Write-Error "poly_plugin.vst3 bundle not found under build/"
            exit 1
          }
          $dest = Join-Path "${{ env.POLY_VST3_INSTALL_DIR }}" "poly_plugin.vst3"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Copy-Item -Recurse -Force $src.FullName $dest
          Write-Host "Installed $($src.FullName) -> $dest"

      # Reset the artifact staging dir immediately before the Cubase phase.
      # The `Test (ctest)` step above inherits POLY_PROBE_OUTPUT process-wide, so
      # poly_probe_tests (S06) writes a golden probe.jsonl into _artifacts during
      # the build pyramid. If left in place, the archive step would collect that
      # ctest output and (in S08) a "probe matches golden" assertion would
      # falsely pass against ctest's own output instead of Cubase's. Wipe and
      # recreate the dir so only the Cubase phase's output lands here.
      - name: Reset artifact dir before Cubase phase
        shell: pwsh
        run: |
          if (Test-Path "${{ env.POLY_ARTIFACT_DIR }}") {
            Remove-Item -Recurse -Force "${{ env.POLY_ARTIFACT_DIR }}"
          }
          New-Item -ItemType Directory -Force -Path "${{ env.POLY_ARTIFACT_DIR }}" | Out-Null

      # --- L4 Cubase launch/quit cycle (scripts/cubase machinery from T02) ---
      - name: Kill stale Cubase
        shell: pwsh
        run: ./scripts/cubase/kill-stale-cubase.ps1

      # The launch step is shared across flows. When POLY_CDP_PORT is set (S09
      # e2e flow), pass -EnableCdp so WebView2 exposes CDP; otherwise the
      # S07/S08 launch is unchanged. Building the arg list in pwsh keeps the
      # conditional out of YAML expression gymnastics.
      - name: Launch Cubase
        shell: pwsh
        run: |
          # Splat as a HASHTABLE, not an array. Array splatting
          # (@("-FixtureCpr", "", ...)) binds tokens positionally and an
          # empty-string value mid-array makes PowerShell's binder mis-align
          # the following token — it rejected -ProbeOutput as a positional arg
          # and failed before Cubase started. A hashtable binds strictly by
          # name, so an empty -FixtureCpr is unambiguous.
          $launchArgs = @{
            CubaseVersion = "${{ env.POLY_CUBASE_VERSION }}"
            FixtureCpr    = "${{ env.POLY_FIXTURE_CPR }}"
            ProbeOutput   = "${{ env.POLY_PROBE_OUTPUT }}"
          }
          if ("${{ env.POLY_CDP_PORT }}" -ne "") {
            $launchArgs["EnableCdp"] = $true
            $launchArgs["CdpPort"]   = "${{ env.POLY_CDP_PORT }}"
          }
          ./scripts/cubase/launch-cubase.ps1 @launchArgs

      - name: Wait for Cubase ready
        shell: pwsh
        run: >-
          ./scripts/cubase/wait-for-ready.ps1
          -TimeoutSeconds 120

      # S09 (L4-web) flow — gated on POLY_CDP_PORT being set. Runs WHILE Cubase
      # is up (CDP attach needs the live editor): Playwright connects over CDP,
      # toggles a kick step in Poly's WebView2 editor, and drives transport via
      # the S08 mido driver. It records the expected hit to a file; the probe
      # assertion itself runs AFTER quit (poly_midi_probe flushes JSONL on
      # deactivate). Windows-only — WKWebView exposes no CDP. Requires a fixture
      # + loopMIDI 'poly-test' port + MIDI Remote script (R10, owner-provisioned),
      # so it stays dormant until POLY_CDP_PORT is set.
      - name: Install e2e deps (Playwright + chromium)
        if: env.POLY_CDP_PORT != ''
        shell: pwsh
        working-directory: tests/cubase/e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: Run L4-web e2e (attach over CDP, toggle step, play transport)
        if: env.POLY_CDP_PORT != ''
        shell: pwsh
        working-directory: tests/cubase/e2e
        run: npx playwright test toggle-step.spec.ts

      # S08 transport run. Gated on a fixture being set: with no fixture this is
      # the S07 launch/quit smoke and there is nothing to play. When the owner
      # commits the fixture and provisions the loopMIDI 'poly-test' port + MIDI
      # Remote script (R10), setting POLY_FIXTURE_CPR turns this on: the mido
      # driver waits for the script's ready ping, starts transport, plays the
      # scenario, and stops. Poly's output is captured by poly_midi_probe and
      # flushed to POLY_PROBE_OUTPUT when Cubase deactivates on quit (below).
      - name: Play scenario (mido driver)
        if: env.POLY_FIXTURE_CPR != ''
        shell: pwsh
        run: |
          python -m pip install --quiet -r tests/cubase/driver/requirements.txt
          python tests/cubase/driver/play_scenario.py --bars 4 --tempo 120

      - name: Quit Cubase
        # Always attempt a clean quit even if wait-for-ready failed, so a hung
        # Cubase is torn down rather than left for the next run.
        if: always()
        shell: pwsh
        run: ./scripts/cubase/quit-cubase.ps1

      # The real end-state the smoke must guarantee: no Cubase process survives.
      # quit-cubase logs its own actions, but this is an independent assertion —
      # if a Cubase process is still running after quit, the smoke did NOT
      # succeed, so fail the job. Only runs when quit itself succeeded (a failed
      # quit already fails the job); on the pass path this is the teeth behind
      # "launched and quit cleanly".
      - name: Assert no Cubase process survives
        shell: pwsh
        run: |
          $names = @("Cubase", "Cubase14", "Cubase13", "Cubase12")
          $survivors = Get-Process -Name $names -ErrorAction SilentlyContinue
          if ($survivors) {
            $ids = ($survivors | ForEach-Object { $_.Id }) -join ", "
            Write-Host "::error::Cubase process(es) survived quit: $ids"
            exit 1
          }
          Write-Host "No Cubase process survives — clean launch/quit confirmed."

      # S08 assertion: the probe JSONL Cubase produced must match the in-process
      # golden for the same preset. Runs after quit (the probe flushes JSONL on
      # Cubase deactivate) and only when a fixture drove a transport run. This is
      # the L3<->L4 cross-check — a field-by-field ppq/pitch/velocity/channel
      # diff, not a byte compare (NoteEvent has interior padding). On mismatch it
      # prints the first diverging events and fails the job.
      - name: Compare probe output to golden
        if: env.POLY_FIXTURE_CPR != ''
        shell: pwsh
        run: |
          python tests/cubase/compare_probe_golden.py `
            --probe "${{ env.POLY_PROBE_OUTPUT }}" `
            --golden "${{ env.POLY_GOLDEN }}"

      # S09 post-quit assertion: the probe JSONL (flushed on the quit above) must
      # contain the kick note-on that toggle-step.spec.ts turned on while Cubase
      # was up. Reads the expected hit the spec recorded and asserts it fired
      # through the real plugin. Gated on the e2e flow being active.
      - name: Assert toggled step in probe (L4-web)
        if: env.POLY_CDP_PORT != ''
        shell: pwsh
        working-directory: tests/cubase/e2e
        run: npx playwright test assert-probe.spec.ts

      - name: Archive logs and probe output
        if: always()
        shell: pwsh
        run: >-
          ./scripts/cubase/archive-logs.ps1
          -CubaseVersion "${{ env.POLY_CUBASE_VERSION }}"
          -ArtifactDir "${{ env.POLY_ARTIFACT_DIR }}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cubase-nightly-artifacts
          path: ${{ env.POLY_ARTIFACT_DIR }}
          retention-days: 14
          if-no-files-found: warn

      # Playwright traces + screenshots (retain-on-failure, see
      # tests/cubase/e2e/playwright.config.ts) so a runner-side CDP/selector
      # failure is diagnosable without re-running. Only on the e2e flow, only on
      # failure — the trace dir is absent on a green run.
      - name: Upload e2e traces on failure
        if: failure() && env.POLY_CDP_PORT != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cubase-e2e-traces
          path: tests/cubase/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Report run status
    needs: [cubase-nightly]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Summarize run result
        id: check
        run: |
          result="${{ needs.cubase-nightly.result }}"
          if [[ "$result" != "success" ]]; then
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
            echo "### ❌ Cubase nightly: $result" >> "$GITHUB_STEP_SUMMARY"
            echo "The launch/quit smoke did not pass — an issue has been filed/updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ Cubase nightly: success" >> "$GITHUB_STEP_SUMMARY"
            echo "Cubase launched and quit cleanly; artifacts uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update issue on failure
        if: steps.check.outputs.has_failure == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = '${{ needs.cubase-nightly.result }}';
            const title = 'Cubase nightly failure';
            const body = [
              `The Cubase-in-the-loop nightly ended with result: **${result}**.`,
              '',
              'Check the run artifacts (Cubase/runner logs, probe JSONL, and any',
              'screen recording) for diagnosis — the launch/quit scripts log each',
              'phase so a hung-Cubase failure is traceable without shelling in.',
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cubase-nightly-failure',
              state: 'open',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cubase-nightly-failure'],
              });
            }
