name: Sanitizers

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    # M050 S01: no job-level continue-on-error. GitHub Actions sets the job's
    # `result` to `success` when continue-on-error is true regardless of what
    # steps did, which made the notify job's `needs.asan.result == "failure"`
    # check dead code. Let the job report failure honestly; the notify job's
    # `if: always()` still runs on either outcome.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DPOLY_ENGINE_ONLY=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_UBSAN=ON -DPOLY_ENGINE_ONLY=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/ubsan.supp:print_stacktrace=1

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DPOLY_ENGINE_ONLY=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan.supp

  # M050 S02: plugin-inclusive sanitizer runs. The engine-only jobs above miss
  # exactly the surface where the P1-P4 review findings lived — plugin/source/
  # processor.cpp with its host<->RT handshake slots. These jobs drop
  # POLY_ENGINE_ONLY so ASan/TSan see the plugin translation unit, and target
  # poly_host_tests explicitly (which links processor.cpp + sdk_hosting and
  # runs the HandshakeStress + TSan-active twin). Bridge tests come along for
  # ASan coverage of the WebUI serialization layer.
  asan-plugin:
    name: AddressSanitizer (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libxcb-util0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
      - name: Build host + bridge tests
        run: cmake --build build --parallel --target poly_host_tests poly_bridge_tests
      - name: Run host tests
        run: ctest --test-dir build --output-on-failure -R "^HostTests\.|^ProbeTestFixture\.|^ProbeChain\.|^GoldenProcessor\."
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp
      - name: Run bridge tests
        run: ctest --test-dir build --output-on-failure -R "^Bridge"
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp

  tsan-plugin:
    name: ThreadSanitizer (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libxcb-util0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON
      - name: Build host tests
        run: cmake --build build --parallel --target poly_host_tests
      - name: Run host tests (includes HandshakeStress_TSanClean, guarded on __has_feature(thread_sanitizer))
        run: ctest --test-dir build --output-on-failure -R "^HostTests\."
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan.supp

  notify:
    name: Failure notification
    needs: [asan, ubsan, tsan, asan-plugin, tsan-plugin]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for failures
        id: check
        run: |
          FAILED=""
          [[ "${{ needs.asan.result }}" == "failure" ]] && FAILED="${FAILED} ASAN"
          [[ "${{ needs.ubsan.result }}" == "failure" ]] && FAILED="${FAILED} UBSAN"
          [[ "${{ needs.tsan.result }}" == "failure" ]] && FAILED="${FAILED} TSAN"
          [[ "${{ needs.asan-plugin.result }}" == "failure" ]] && FAILED="${FAILED} ASAN-PLUGIN"
          [[ "${{ needs.tsan-plugin.result }}" == "failure" ]] && FAILED="${FAILED} TSAN-PLUGIN"
          if [ -n "$FAILED" ]; then
            echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create issue on failure
        if: steps.check.outputs.has_failure == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const failed = '${{ steps.check.outputs.failed }}'.trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Sanitizer nightly failure:${failed}`;
            const body = [
              `The nightly sanitizer run detected failures in: **${failed}**`,
              '',
              `[View workflow run](${runUrl})`,
              '',
              `Triggered: ${new Date().toISOString().split('T')[0]}`
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sanitizer-failure',
              state: 'open'
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sanitizer-failure']
              });
            }
