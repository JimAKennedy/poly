name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --all-files
      - name: SPDX headers present on all tracked C/C++/ObjC sources
        run: bash scripts/check-spdx-headers.sh
      - name: SPDX guard contract + green/red behavior proof
        run: node --test scripts/check-spdx-headers.mjs
      - name: No personal-machine paths in tracked files
        run: bash scripts/check-personal-paths.sh
      - name: Personal-path guard contract + green/red behavior proof
        run: node --test scripts/check-personal-paths.mjs
      - name: Site docs are project-specific, not Starlight template boilerplate
        run: bash scripts/check-site-readme.sh
      - name: Site-readme guard contract + green/red behavior proof
        run: node --test scripts/check-site-readme.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DSMTG_RUN_VST_VALIDATOR=ON
          # D029 (M054 S02): Poly ships no Linux VST3, so the Linux leg builds the
          # portable engine only (-DPOLY_ENGINE_ONLY=ON, no VST3 SDK / editor).
          # SMTG_RUN_VST_VALIDATOR is dropped — there is no plugin to validate.
          - os: ubuntu-latest
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOLY_ENGINE_ONLY=ON
          - os: windows-2022
            cmake-args: -G "Visual Studio 17 2022" -DSMTG_RUN_VST_VALIDATOR=ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install dependencies (Linux)
        # D029 (M054 S02): engine-only build needs only Ninja — no VSTGUI/GTK/X11
        # UI libs, since -DPOLY_ENGINE_ONLY=ON compiles the platform-independent
        # poly_engine with no VST3 SDK or editor.
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Cache VST3 SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/vst3sdk-src
          key: vst3sdk-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Cache GoogleTest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/googletest-src
          key: gtest-${{ matrix.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.os }}
          path: build/**/*.vst3
          retention-days: 14

  # M051 S03: AudioUnit v2 (aumu Poly JkDl) build + validation. The Steinberg AU
  # wrapper (public.sdk/source/vst/auwrapper) is hard-gated on the Xcode generator
  # in the SDK (SMTG_AddVST3AuV2.cmake), so it CANNOT ride the `build` matrix leg —
  # that leg uses -G Ninja and must stay that way (it drives the VST3, unit/visual/
  # interaction tests and feeds pluginval). This is the AU's OWN macOS job:
  #   1. Configure with -G Xcode. Under the Xcode generator the root CMakeLists
  #      fetches Apple's AudioUnitSDK and flips SMTG_ENABLE_AUV2_BUILDS on, so the
  #      poly_au target (Poly.component, wrapping the poly_plugin VST3) is defined.
  #   2. Build the poly_au target (pulls poly_plugin as a dependency).
  #   3. Install the .component and validate it end-to-end with
  #      `auval -v aumu Poly JkDl` — exit 0 is a validation PASS; the full auval -v
  #      log is the diagnostic surface for AU load/validation failures.
  #   4. Upload the .component. There is no separate release workflow in this repo;
  #      CI artifact upload IS the distribution channel, mirroring `Upload plugin`
  #      for the VST3.
  build-au-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Cache VST3 SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-au/_deps/vst3sdk-src
          key: vst3sdk-au-macos-14-${{ hashFiles('CMakeLists.txt') }}
      - name: Cache AudioUnitSDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-au/_deps/audiounitsdk-src
          key: audiounitsdk-au-macos-14-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure (Xcode generator, AUv2 enabled)
        run: cmake -S . -B build-au -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build AU (poly_au target)
        run: cmake --build build-au --config Release --target poly_au --parallel
      - name: Locate built .component
        id: find-au
        run: |
          AU_PATH=$(find build-au -name "Poly.component" -type d | head -1)
          if [ -z "$AU_PATH" ]; then
            echo "::error::Poly.component not found under build-au"
            exit 1
          fi
          echo "path=$AU_PATH" >> "$GITHUB_OUTPUT"
          echo "Found AU at: $AU_PATH"
      - name: Install component for auval
        run: |
          DEST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DEST"
          rm -rf "$DEST/Poly.component"
          cp -R "${{ steps.find-au.outputs.path }}" "$DEST/"
          # Force the AudioComponent registrar to rescan so auval sees the
          # freshly installed component instead of a stale cache.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: Validate AU (auval)
        run: auval -v aumu Poly JkDl
      - name: Upload AU component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poly-au-macos-14
          path: build-au/**/*.component
          retention-days: 14

  engine-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Configure engine-only (no VST3 SDK)
        run: cmake -S . -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOLY_ENGINE_ONLY=ON
      - name: Build engine
        run: cmake --build build-engine --parallel
      - name: Run engine tests
        run: ctest --test-dir build-engine --output-on-failure
      # M032 export UAT automation (Level C): independent-parser validation of the
      # MIDI export. poly_smf_emit renders the default preset to a real .mid via
      # the same renderPatternToSMF primitive the WebUI Export chip uses; the mido
      # validator (an SMF parser we don't own) then asserts the M032 contract —
      # Format-1, conductor-only tempo, one named GM track per active lane, and no
      # dropped notes. This replaces the "open the .mid in Cubase and eyeball the
      # named tracks" manual UAT with an offline, Cubase-free gate. The in-DAW
      # export path itself is exercised by the Cubase nightly L4-web e2e.
      - name: Install SMF validator deps (mido)
        run: python -m pip install --quiet mido==1.3.3
      - name: Unit-test the SMF validator (contract has teeth)
        working-directory: tests/cubase
        run: python -m unittest test_validate_smf_export -v
      - name: Validate MIDI export contract (independent parser)
        run: |
          set -euo pipefail
          emit=$(find build-engine -name poly_smf_emit -type f | head -1)
          if [ -z "$emit" ]; then
            echo "::error::poly_smf_emit not built under build-engine"
            exit 1
          fi
          mkdir -p _smf
          # All-lanes export: multiple named GM tracks, no loss, host tempo 120.
          "$emit" _smf/all.mid
          python tests/cubase/validate_smf_export.py _smf/all.mid \
            --expected-bpm 120 --min-note-ons 16
          # Single-lane export (M032 S02): exactly one named "Kick" track.
          "$emit" _smf/lane0.mid 0
          python tests/cubase/validate_smf_export.py _smf/lane0.mid \
            --expected-bpm 120 --expected-named-tracks 1 --min-note-ons 4 \
            --lane-name Kick
      - name: Verify no VST3 SDK fetched
        run: |
          if [ -d "build-engine/_deps/vst3sdk-src" ]; then
            echo "::error::Engine build fetched VST3 SDK — isolation violated"
            exit 1
          fi

  # M031 S04: clang-tidy gate. This runs clang-tidy on PR-changed engine C/C++
  # files and fails ONLY on the `.clang-tidy` WarningsAsErrors set (8 real-defect
  # checks: use-after-move, dangling-handle, move-forwarding-reference,
  # pro-type-member-init, slicing, use-nullptr, move-const-arg,
  # unnecessary-copy-initialization). D032 recon proved the engine tree carries
  # ~1,400 full-roster clang-tidy warnings but ZERO WarningsAsErrors hits today,
  # so gating on the full roster would be red-on-arrival. The honest, green gate
  # is therefore WarningsAsErrors-only; the legacy full-roster warnings stay
  # advisory (burndown is a documented out-of-scope follow-up). Plugin/source is
  # NOT covered here: the engine-only configure produces a compile DB without
  # the VST3 SDK, and plugin/source tidy coverage is a separate follow-up (it
  # would need the full VST3 toolchain in this job). The shared runner
  # scripts/run-clang-tidy-changed.sh is the single seam both this job and any
  # future caller invoke; parsing the gated set from .clang-tidy keeps that file
  # the single source of truth.
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # Need the PR base commit present locally to diff changed files.
          fetch-depth: 0
      - name: Install clang-tidy and Ninja
        run: sudo apt-get install -y clang-tidy ninja-build
      - name: Configure engine-only (compile DB for clang-tidy)
        run: cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOLY_ENGINE_ONLY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy gate on changed engine files
        env:
          # Diff against the PR base SHA (pull_request) or the pushed-from SHA
          # (push). Both are fetched with fetch-depth: 0 above.
          POLY_TIDY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          POLY_TIDY_BUILD_DIR: build-tidy
        run: bash scripts/run-clang-tidy-changed.sh

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install dependencies
        run: sudo apt-get install -y ninja-build lcov
      - name: Configure with coverage
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DPOLY_ENGINE_ONLY=ON
      - name: Build and test
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Generate coverage
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' \
               --output-file coverage.filtered.info
          genhtml coverage.filtered.info --output-directory coverage-report
      - name: Check 60% threshold
        run: |
          COVERAGE=$(lcov --summary coverage.filtered.info 2>&1 | grep 'lines' | awk '{print $2}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% below 60% threshold"
            exit 1
          fi
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.filtered.info
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report/

  # M031 S05: plugin-layer coverage. The main `code-coverage` job configures
  # engine-only (-DPOLY_ENGINE_ONLY=ON, ci.yml `code-coverage`) so it never
  # compiles plugin/source/*.cpp — engine coverage only. This job drops
  # POLY_ENGINE_ONLY and builds poly_host_tests, the sole target that compiles
  # plugin/source/processor.cpp + controller_base.cpp against the real VST3 SDK
  # (tests/CMakeLists.txt), with --coverage instrumentation, then scopes lcov to
  # plugin/source/** so Codecov gets a `plugin` flag distinct from the engine
  # coverage flag. The apt dependency list mirrors the sanitizers.yml
  # `asan-plugin` job — the proven recipe for a full (non-engine-only)
  # host-tests build on ubuntu. Advisory by design: no percentage threshold
  # gates the build and fail_ci_if_error stays false (the plugin layer's
  # coverage baseline is still being established); the job's PASS signal is that
  # the plugin translation units build and the host tests run green under
  # instrumentation, and the printed lcov summary reports the plugin percent.
  plugin-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lcov libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libxcb-util0-dev
      - name: Cache VST3 SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/vst3sdk-src
          key: vst3sdk-plugin-coverage-${{ hashFiles('CMakeLists.txt') }}
      - name: Cache GoogleTest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/googletest-src
          key: gtest-plugin-coverage-${{ hashFiles('tests/CMakeLists.txt') }}
      - name: Configure with coverage (full, non-engine-only)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
      - name: Build host tests (compiles plugin/source/processor.cpp + controller_base.cpp)
        run: cmake --build build --parallel --target poly_host_tests
      - name: Run host tests
        run: ctest --test-dir build --output-on-failure -R "^HostTests\.|^GoldenProcessor\."
      - name: Generate plugin-scoped coverage
        run: |
          lcov --capture --directory build --output-file coverage-plugin.info \
               --ignore-errors mismatch
          lcov --extract coverage-plugin.info '*/plugin/source/*' \
               --output-file coverage-plugin.filtered.info \
               --ignore-errors empty
          echo "### Plugin-layer coverage" >> "$GITHUB_STEP_SUMMARY"
          lcov --list coverage-plugin.filtered.info | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov (plugin flag)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-plugin.filtered.info
          flags: plugin
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-coverage-report
          path: coverage-plugin.filtered.info
          retention-days: 14

  webui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        working-directory: webui
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: webui
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        working-directory: webui
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: webui
        run: npx playwright test
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-html-report
          path: webui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-test-results
          path: webui/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-screenshots
          path: webui/test-results/screenshots/
          retention-days: 30
          if-no-files-found: ignore

  # M048 S13: pluginval was previously a matrix job with 2 legs (macOS, Linux).
  # PR #104 (run 29990515657) revealed two matrix-related bugs in GitHub Actions:
  #   1. `needs.pluginval.result` in ci-complete reported `success` while the
  #      ubuntu leg was still `in_progress` — allowing ci-complete to pass
  #      advisorily against a leg that hadn't finalized.
  #   2. The ubuntu leg's outer job envelope stayed `in_progress` indefinitely
  #      after all its steps had completed successfully. Manual re-run was
  #      required to make GitHub finalize the check run.
  # Fix: split into two explicit jobs so ci-complete's `needs` list references
  # two individually-tracked check runs, each of which GitHub finalizes on its
  # own. `build` remains a matrix (3 legs, no observed bug, split would add
  # substantial churn); revisit if the same class of failure surfaces there.
  #
  # M050 S04 (G4): pluginval is pinned to v1.0.4 (Tracktion release from
  # 2024-12-04). Using releases/latest/download would silently pull in whatever
  # is current at the time each job runs — an upstream point release could add
  # new tests, change strictness defaults, or bump the timeout floor, turning a
  # "passing yesterday" build into a red merge with no local diff to explain
  # it. To bump the pin: (1) verify the new tag exists at
  # https://github.com/Tracktion/pluginval/releases with all three platform
  # zips, (2) update all three URLs below in one PR, (3) let CI prove the
  # current plugin still passes at the new version's strictness.

  pluginval-macos:
    needs: build
    runs-on: macos-14
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-macos-14
          path: plugin
      - name: Find VST3 bundle
        id: find-vst3
        run: |
          VST3_PATH=$(find plugin -name "*.vst3" -not -name "*probe*" -type d | head -1)
          echo "path=$VST3_PATH" >> "$GITHUB_OUTPUT"
          echo "Found VST3 at: $VST3_PATH"
      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
      - name: Run pluginval
        run: |
          chmod +x "pluginval.app/Contents/MacOS/pluginval"
          "pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 8 \
            --skip-gui-tests \
            --timeout-ms 120000 \
            --validate "${{ steps.find-vst3.outputs.path }}"

  # D029 (M054 S02): the Linux plugin-validation job was removed. Poly ships no
  # Linux VST3, and the Linux `build` leg now compiles engine-only
  # (-DPOLY_ENGINE_ONLY=ON), so there is no Linux plugin artifact to validate.
  # macOS + Windows pluginval cover the shipping plugin targets; engine
  # portability stays covered by the engine-isolation, code-coverage, and
  # wasm-build legs.

  # M050 S03 (G3): pluginval on the Windows artifact. Windows is where several
  # plugin-loading bugs historically hide (COM apartment threading, DLL search
  # order, path-encoding for CFBundle-equivalents), so absence of Windows
  # pluginval was the largest coverage gap on this axis. Same strictness (8),
  # same GUI-skip, same 120s timeout as the macOS/Linux siblings so all three
  # platforms surface the same class of failures. Uses git-bash (default shell
  # on windows-2022 for `run:` blocks named without `shell:`) — the find/curl/
  # unzip invocations match the sibling jobs.
  pluginval-windows:
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-windows-2022
          path: plugin
      - name: Find VST3 bundle
        id: find-vst3
        run: |
          VST3_PATH=$(find plugin -name "*.vst3" -not -name "*probe*" -type d | head -1)
          echo "path=$VST3_PATH" >> "$GITHUB_OUTPUT"
          echo "Found VST3 at: $VST3_PATH"
      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -q pluginval.zip
      - name: Run pluginval
        run: |
          ./pluginval.exe \
            --strictness-level 8 \
            --skip-gui-tests \
            --timeout-ms 120000 \
            --validate "${{ steps.find-vst3.outputs.path }}"

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 3.1.61
      - name: Configure WASM build
        run: emcmake cmake -S . -B build-wasm -DPOLY_ENGINE_ONLY=ON
      - name: Build WASM
        run: cmake --build build-wasm --target poly_wasm --parallel
      - name: Report artifact sizes
        run: |
          WASM_SIZE=$(wc -c < build-wasm/poly_engine.wasm)
          JS_SIZE=$(wc -c < build-wasm/poly_engine.js)
          echo "### WASM Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`poly_engine.wasm\`: ${WASM_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`poly_engine.js\`: ${JS_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-build
          path: |
            build-wasm/poly_engine.wasm
            build-wasm/poly_engine.js
          retention-days: 14

  site-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # jk-standards doc-drift needs the full history for merge-base and
          # Docs-Not-Affected trailer scanning on pull_request events.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install site dependencies (for js-yaml in claim tests)
        working-directory: site
        run: npm ci
      - name: Install jk-standards
        run: pip install "git+https://github.com/JimAKennedy/jk-standards@v0.12.0"
      - name: Install and verify vendored jk-standards skills
        run: |
          jk-standards install-skills --dest .claude/skills
          jk-standards install-skills --dest .claude/skills --check
      # Workflow commands ride the same skills-lock.json as the skills, under the
      # same hash discipline. The `jk` subdirectory is what namespaces them as
      # /jk:<name>, so it must match the --dest .gitignore excludes.
      - name: Install and verify vendored jk-standards commands
        run: |
          jk-standards install-commands --dest .claude/commands/jk
          jk-standards install-commands --dest .claude/commands/jk --check
      - name: Regenerate params.json from engine headers (M048 S05 input)
        run: node site/scripts/generate-params-json.mjs
      - name: Doc discipline checks (M048 S01/S02/S05/S06/S09/S10/S11 via jk-standards)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: jk-standards all
      - name: Check bridge schema coverage (M048 S07)
        run: node scripts/check-bridge-schema-coverage.mjs
      - name: Check doc-conformance + audit-ledger guardrail suite (M071 S06 + M001 S01)
        run: bash scripts/check-doc-conformance.sh
      - name: Check site asset references
        run: bash scripts/check-site-assets.sh
      - name: Validate sample manifest (strict)
        run: bash scripts/check-sample-manifest.sh --strict
      - name: Validate sample manifest (GM coverage)
        run: bash scripts/check-sample-manifest.sh --coverage

  # region:site-e2e-job
  site-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 3.1.61
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: site
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run local site-verify pipeline (S10 + S11 + S13 + sample-equivalence + S14 + S15-S16 macro-diff + S06 first-bar-parity + S18 gates)
        run: bash scripts/site-verify-local.sh
      # endregion:site-e2e-job
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-local-verify-report
          path: site/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-local-verify-test-results
          path: site/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload local-verify summary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-local-verify-summaries
          path: .gsd/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  ci-complete:
    needs: [code-quality, clang-tidy, build, build-au-macos, engine-isolation, secrets-scan, code-coverage, plugin-coverage, webui-tests, pluginval-macos, pluginval-windows, wasm-build, site-lint, site-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.clang-tidy.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.build-au-macos.result }}" != "success" ]] || \
             [[ "${{ needs.engine-isolation.result }}" != "success" ]] || \
             [[ "${{ needs.secrets-scan.result }}" != "success" ]] || \
             [[ "${{ needs.code-coverage.result }}" != "success" ]] || \
             [[ "${{ needs.plugin-coverage.result }}" != "success" ]] || \
             [[ "${{ needs.webui-tests.result }}" != "success" ]] || \
             [[ "${{ needs.pluginval-macos.result }}" != "success" ]] || \
             [[ "${{ needs.pluginval-windows.result }}" != "success" ]] || \
             [[ "${{ needs.wasm-build.result }}" != "success" ]] || \
             [[ "${{ needs.site-lint.result }}" != "success" ]] || \
             [[ "${{ needs.site-e2e.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
