name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'engine/**'
      - 'webui/**'
      - 'CMakeLists.txt'
      - 'scripts/build-wasm.sh'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      wasm_sha256: ${{ steps.wasm-hash.outputs.wasm_sha256 }}
      js_sha256: ${{ steps.wasm-hash.outputs.js_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Check site asset references
        run: bash scripts/check-site-assets.sh
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 3.1.61
      - name: Build WASM
        run: bash scripts/build-wasm.sh
      - name: Compute WASM sha256 for freshness gate
        id: wasm-hash
        run: |
          wasm_sha=$(sha256sum build-wasm/poly_engine.wasm | awk '{print $1}')
          js_sha=$(sha256sum build-wasm/poly_engine.js | awk '{print $1}')
          echo "wasm_sha256=${wasm_sha}" >> "$GITHUB_OUTPUT"
          echo "js_sha256=${js_sha}" >> "$GITHUB_OUTPUT"
          echo "poly_engine.wasm sha256: ${wasm_sha}"
          echo "poly_engine.js   sha256: ${js_sha}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: |
          npm run generate-presets
          npm run copy-webui
          cp ../build-wasm/poly_engine.js ../build-wasm/poly_engine.wasm public/webui/
          npx astro build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-deployed:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: site
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run remote audio + preset-consistency gates
        env:
          POLY_EXPECTED_WASM_SHA256: ${{ needs.build.outputs.wasm_sha256 }}
          POLY_EXPECTED_JS_SHA256: ${{ needs.build.outputs.js_sha256 }}
        run: bash scripts/site-verify-remote.sh "${{ needs.deploy.outputs.page_url }}"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-remote-verify-report
          path: site/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-remote-verify-test-results
          path: site/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload remote-verify summary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-remote-verify-summaries
          path: .gsd/artifacts/
          retention-days: 14
          if-no-files-found: ignore
