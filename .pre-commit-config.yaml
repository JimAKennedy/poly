repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(\.gsd/|\.bg-shell/|.*\.uidesc$)'
      - id: end-of-file-fixer
        exclude: '^(\.gsd/|\.bg-shell/|.*\.uidesc$)'
      - id: check-yaml
        # .clang-format uses a multi-document YAML stream (--- separates the
        # Cpp and ObjC language sections). clang-format is its real validator
        # and passes; the generic single-document check-yaml would reject it.
        exclude: '^\.clang-format$'
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/cmake-lint/cmake-lint
    rev: 1.4.3
    hooks:
      - id: cmakelint

  - repo: https://github.com/JimAKennedy/jk-standards
    rev: v0.13.0
    hooks:
      - id: doc-taxonomy
      - id: status-prose
      - id: file-line-refs
      # Delivery ledgers under docs/plans/. Pinned here rather than left to the
      # doc-discipline validation token, which resolves `jk-standards` from
      # PATH and so gates against whatever version happens to be installed.
      - id: ledger

  # region:local-hooks
  - repo: local
    hooks:
      - id: check-pragma-once
        name: Check pragma once in headers
        entry: scripts/check-pragma-once.sh
        language: script
        files: '\.(h|hpp)$'
      - id: check-realtime-safety
        name: Check real-time safety
        entry: scripts/check-realtime-safety.sh
        language: script
        pass_filenames: false
      - id: check-snippet-regions
        name: Check CodeSnippet region markers exist
        entry: scripts/check-snippet-regions.sh
        language: script
        pass_filenames: false
      - id: pre-push-check
        name: Pre-push quality gate
        entry: scripts/pre-push-check.sh
        language: script
        pass_filenames: false
        stages: [pre-push]
  # endregion:local-hooks

ci:
  skip: [doc-taxonomy, status-prose, file-line-refs, check-pragma-once, check-realtime-safety, check-snippet-regions, pre-push-check]
