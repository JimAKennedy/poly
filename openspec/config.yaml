schema: spec-driven

context: |
  Poly is a MIDI-only VST3 instrument: a polymetric drum pattern generator in
  C++20 (engine as a pure static library with no VST3 or audio-thread
  dependency; plugin layer on the VST3 SDK with a choc WebView editor), CMake,
  Google Test. Read CLAUDE.md for the conventions (real-time safety, versioned
  state serialization, determinism from absolute PPQ, MSVC portability,
  clang-format) and ARCHITECTURE.md for the shape of the code.
  Delivery runs through jk-standards ledgers under docs/plans/<slug>/; a
  ledger's Source: may name a change under openspec/changes/<id>/, and the
  /jk:* commands then execute it. Commits carry Plan:, Slice: and Rows: lines.

