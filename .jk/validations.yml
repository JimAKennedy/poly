# Validation tokens for the jk-standards delivery workflow.
#
# A slice in docs/plans/<slug>/ledger.md names TOKENS, never commands — the
# ledger says which class of assurance the slice owes, and this file says how
# that assurance is obtained in this repo. The `ledger` check asserts that
# every token a ledger cites appears here, so a typo fails rather than
# silently skipping a gate.
#
# The set mirrors the CI job graph in .github/workflows/ci.yml, so a slice that
# passes its tokens locally is a slice CI is likely to agree with. Tokens are
# ordered cheapest-first: a slice normally owes `format` plus whichever of the
# subject-matter tokens its change actually touches, and `gate` before it ships.

# Formatting, whitespace, and the pinned clang-format. Seconds.
# pre-push-exempt: format — step 1 runs `pre-commit run clang-format` on staged files, which is
# narrower than this token. Marking it run would certify something untrue; the
# full sweep is a CI job and a deliberate local command.
format: pre-commit run --all-files

# Engine + plugin unit and golden tests. The inner loop for C++ work; assumes
# `build/` is already configured (scripts/build.sh does that once).
unit: cmake --build build --config Release --parallel && ctest --test-dir build --build-config Release --output-on-failure

# The engine compiles and passes its tests with no VST3 SDK present — the
# boundary the architecture depends on. Slower than `unit` because it
# configures a second build tree; owed by any slice touching engine/.
# pre-push-exempt: engine-isolation — configures and builds a second CMake tree, minutes rather than
# seconds. Owed by slices touching engine/, and run by CI on every push.
engine-isolation: cmake -S . -B build-engine -DCMAKE_BUILD_TYPE=Release -DPOLY_ENGINE_ONLY=ON && cmake --build build-engine --parallel && ctest --test-dir build-engine --output-on-failure

# No allocation, locks, or blocking calls on the audio thread. Owed by any
# slice touching process(), renderRange(), or setActive().
rt-safety: bash scripts/check-realtime-safety.sh

# The doc-conformance guardrail suite: euclidean claims, preset tables, prose
# claims, and the audit ledgers. Owed by any slice touching site prose or the
# data those claims are derived from. Needs site/node_modules (npm ci in site/).
doc-conformance: bash scripts/check-doc-conformance.sh

# The jk-standards doc-discipline checks: taxonomy, drift, status prose,
# file:line refs, snippet regions, and ledger conformance.
#
# The wrapper supplies the base ref CI supplies, so doc-drift actually runs.
# `jk-standards all` with no base prints a "skipped" line and exits 0, which is
# how M005 shipped a doc-drift violation through a green local validation set.
# An unresolvable base is not a silent-skip path: jk-standards exits 2 there.
doc-discipline: bash scripts/check-doc-discipline.sh

# Region markers referenced by docs resolve to real markers in the tree.
snippet-regions: bash scripts/check-snippet-regions.sh

# Site unit tests (node --test over site/tests).
site-unit: npm --prefix site test

# The full local site-verify pipeline: Playwright end-to-end gates, sample
# equivalence, macro-diff, and first-bar parity. Minutes, not seconds.
# pre-push-exempt: e2e — minutes of Playwright, and it rewrites the committed WASM artifacts
# in webui/ as a side effect — a push-time gate must not dirty the tree.
e2e: bash scripts/site-verify-local.sh

# WebUI Playwright specs against the mock and wasm hosts.
# pre-push-exempt: webui-e2e — needs a Playwright browser stack installed; not present on a clean
# checkout.
webui-e2e: npm --prefix webui test

# The checked-in WASM artifacts match a fresh build of the engine they claim
# to be. Owed by any slice touching engine/ or the wasm bindings.
# pre-push-exempt: wasm-freshness — compares the committed artifacts against a deployed URL, so it has
# nothing to check from a clean checkout and needs the network.
wasm-freshness: bash scripts/check-wasm-freshness.sh

# The Cubase e2e harness's own checks: the specs type-check, the helper-lib unit
# tests pass, and the independent SMF/probe validators pass. Runs anywhere and
# does NOT run Cubase -- a slice adding a nightly spec owes this plus a named
# nightly run in its evidence, because the only gate that proves a spec works
# against a real DAW is the nightly itself.
# pre-push-exempt: cubase-harness — needs its own npm install under tests/cubase/e2e plus a Python
# toolchain; the nightly is what proves a spec against a real DAW.
cubase-harness: npm --prefix tests/cubase/e2e run typecheck && npm --prefix tests/cubase/e2e run test:unit && python3 -m unittest discover -s tests/cubase -p 'test_*.py'

# The repo guards CI enforces that no other local command reaches: SPDX headers,
# personal paths, the site and scripts READMEs and their green/red contract
# proofs, the sample manifest (both flag sets, as CI runs it), site asset
# references, and bridge schema coverage. Owed by any slice touching what they
# guard. Before M007 these ran in CI and nowhere a developer could invoke, which
# is how three consecutive ships went green locally and red in CI.
guards: bash scripts/check-guards.sh

# All five sanitizer variants the nightly runs, in the same order and with the
# same targets and filters -- engine-only ASan/UBSan/TSan, then the two
# plugin-inclusive jobs that omit POLY_ENGINE_ONLY so the sanitizers see
# plugin/source/. Added by /jk:assess for the guide-parity programme's GP5:
# issue #142 is an intermittent finding at roughly 5% of nightlies, and nothing
# could reproduce it on a laptop because no local command ran these at all.
#
# Separate build trees per variant, because the flags are incompatible and a
# shared tree would silently reuse the previous variant's objects. Five Debug
# builds: minutes, not seconds.
# pre-push-exempt: sanitizers — five Debug builds with incompatible sanitizer
# flags, each in its own tree. Minutes, not seconds, and the nightly already
# runs them on every scheduled build. A push-time gate that costs five builds is
# a gate people bypass.
sanitizers: >
  cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DPOLY_ENGINE_ONLY=ON && cmake --build build-asan --parallel && ctest --test-dir build-asan --output-on-failure &&
  cmake -S . -B build-ubsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_UBSAN=ON -DPOLY_ENGINE_ONLY=ON && cmake --build build-ubsan --parallel && ctest --test-dir build-ubsan --output-on-failure &&
  cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DPOLY_ENGINE_ONLY=ON && cmake --build build-tsan --parallel && ctest --test-dir build-tsan --output-on-failure &&
  cmake -S . -B build-asan-plugin -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON && cmake --build build-asan-plugin --parallel --target poly_host_tests poly_bridge_tests && ctest --test-dir build-asan-plugin --output-on-failure -R "^HostTests\.|^ProbeTestFixture\.|^ProbeChain\.|^GoldenProcessor\." && ctest --test-dir build-asan-plugin --output-on-failure -R "^Bridge" &&
  cmake -S . -B build-tsan-plugin -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON && cmake --build build-tsan-plugin --parallel --target poly_host_tests && TSAN_OPTIONS=suppressions="$PWD/.github/tsan.supp" ctest --test-dir build-tsan-plugin --output-on-failure -R "^HostTests\."

# The whole pre-push gate: format, RT safety, snippet regions, build, tests,
# and pluginval. The token a slice owes before /jk:ship, not during /jk:next.
# pre-push-exempt: gate — this token *is* the pre-push gate. Running it from inside itself
# would recurse.
gate: bash scripts/pre-push-check.sh
